[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},${minecraft_version_upper_limit})"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "${config_overhauled_mod_id}"
type="required"
mandatory = true
versionRange = "[${config_overhauled_version},${config_overhauled_version_upper_limit})"
