modLoader = "javafml" #mandatory
loaderVersion = "${forge_loader_version_range}" #mandatory
license = "${license}"
issueTrackerURL="https://github.com/JohnSmith474Mods/Enchanting-Overhauled/issues"
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
displayURL="https://modrinth.com/mod/enchanting-overhauled"
logoFile = "${mod_id}.png"
credits = "${credits}"
authors = "${mod_author}"
