plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    compileOnly "maven.modrinth:config-overhauled:1.0.1+1.21-neoforge"
    compileOnly "johnsmith.enchantmentcore:enchantment-core:1.1.0+1.21-neoforge"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

sourceSets {
    main {
        resources {
            // Include standard resources
            srcDirs += ['src/main/resources']
            // Include our routed datagen output
            srcDirs += ['src/main/generated']
        }
    }
}

artifacts {
    // Expose directory elements to platform projects
    commonJava sourceSets.main.java.sourceDirectories.elements
    commonResources sourceSets.main.resources.sourceDirectories.elements
}