plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = project.mod_name_normalized
    version = "${project.version}+${project.minecraft_version}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups("org.spongepowered") }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

sourcesJar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            // Project
            'version'                               : version,
            'group'                                 : project.group,
            'java_version'                          : java_version,
            // Minecraft
            'minecraft_version'                     : minecraft_version,
            'minecraft_version_supremum'            : minecraft_version_supremum,
            'minecraft_version_upper_limit'         : minecraft_version_upper_limit,
            // Common
            'mod_name'                              : mod_name,
            'mod_author'                            : mod_author,
            'mod_id'                                : mod_id,
            'license'                               : license,
            'credits'                               : credits,
            'description'                           : project.description,
            // Fabric
            'fabric_version'                        : fabric_version,
            'fabric_loader_version'                 : fabric_loader_version,
            // Forge
            "forge_version"                         : forge_version,
            "forge_loader_version_range"            : forge_loader_version_range,
            // NeoForge
            'neoforge_version'                      : neoforge_version,
            'neoforge_loader_version_range'         : neoforge_loader_version_range,
            // Config Overhauled
            "config_overhauled_mod_id"              : config_overhauled_mod_id,
            "config_overhauled_project_id"          : config_overhauled_project_id,
            "config_overhauled_project_name"        : config_overhauled_project_name,
            "config_overhauled_version"             : config_overhauled_version,
            "config_overhauled_version_upper_limit" : config_overhauled_version_upper_limit,
            // Enchantment Core
            "enchantment_core_mod_id"               : enchantment_core_mod_id,
            "enchantment_core_project_id"           : enchantment_core_project_id,
            "enchantment_core_project_name"         : enchantment_core_project_name,
            "enchantment_core_version"              : enchantment_core_version,
            "enchantment_core_version_upper_limit"  : enchantment_core_version_upper_limit
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\r\n", "\n").replace("\n", "\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
    inputs.properties(jsonExpandProps.collectEntries { key, value -> [('json_' + key): value] })
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv("local_maven_url")
        }
    }
}
