description=Enchanting Overhauled replaces random enchanting mechanics with deterministic progression, modular altars, autonomous entities, and exploration-driven progression.\
\n\
\n\
\n\Key Features:\
\n- Modular Enchanting Altars:\
\n\     Replace the vanilla enchanting table with multi-stage altars providing deterministic enchantment selection, page cycling, and power scaling.\
\n\
\n- Data-Driven Thematic Arcane Gating:\
\n\     Gate specialized enchantments behind environmental catalysts and dimensional artifacts placed near the altar. Channel discrete thematic categories including Arcane, Infernal, Numinous, Ominous, Volatile, and Corrupted power sources.\
\n\
\n- Scribing Mini-Game:\
\n\     Inscribe enchantments at lecterns using classic and constraint-solving logic puzzle mechanics.\
\n\
\n- Living Arcane Entities:\
\n\     Engage autonomous Enchanted Tome and Book entities featuring school-based AI spellcasting, projectile deflection, and minion summoning.\
\n\
\n- Tiered Enchantment Sources:\
\n\     Collect persistent Enchanted Tomes that remain intact after use and consumable Enchanted Pages for single-tier transfers.\
\n\
\n- Procedural World Structures:\
\n\     Explore multi-story Scribe's Rise towers and Enchanted Libraries featuring procedural degradation states and custom loot tables.\
\n\
\n- Data-Driven Enchant Recipes:\
\n\     Configure item transmutations during enchantment application, source depletion, and grindstone disenchants. Define custom input-output transformations and item states through JSON registries.\
\n\
\n- Systemic Balancing:\
\n\     Enforce strict item capacity limits, experience-free mundane anvil repairs, and consolidated level tiers.\
\n\
\n- In-Game Configuration & Datapack Integration:\
\n\     Adjust mechanics, numerical limits, and interface options in real time using Config Overhauled. Customize enchantment themes, recipes, and modular content through registered datapacks.

