description=Enchanting Overhauled reimagines Minecraft's magic system, replacing RNG-heavy\
\n\enchanting with deterministic modular altars, lectern scribing, living arcane\
\n\entities, and exploration-driven progression.\
\n\
\n\
\n\Key Features:\
\n- Modular Enchanting Altars:\
\n\     Replace the vanilla enchanting table with multi-stage altars providing\
\n\     deterministic enchantment selection, page cycling, and power scaling.\
\n\
\n- Data-Driven Thematic Arcane Gating:\
\n\     Gate specialized enchantments behind environmental catalysts and\
\n\     dimensional artifacts placed near the altar. Channel discrete thematic\
\n\     categories including Arcane, Infernal, Numinous, Ominous, Volatile, and\
\n\     Corrupted power sources.\
\n\
\n- Scribing Mini-Game:\
\n\     Inscribe enchantments at lecterns using classic and constraint-solving\
\n\     logic puzzle mechanics.\
\n\
\n- Living Arcane Entities:\
\n\     Engage autonomous Enchanted Tome and Book entities featuring school-based\
\n\     AI spellcasting, projectile deflection, and minion summoning.\
\n\
\n- Tiered Enchantment Sources:\
\n\     Collect persistent Enchanted Tomes that remain intact after use and\
\n\     consumable Enchanted Pages for single-tier transfers.\
\n\
\n- Procedural World Structures:\
\n\     Explore multi-story Scribe's Rise towers and Enchanted Libraries featuring\
\n\     procedural degradation states and custom loot tables.\
\n\
\n- Data-Driven Enchant Recipes:\
\n\     Configure item transmutations during enchantment application, source\
\n\     depletion, and grindstone disenchants. Define custom input-output\
\n\     transformations and item states through JSON registries.\
\n\
\n- Systemic Balancing:\
\n\     Enforce strict item capacity limits, experience-free mundane anvil repairs,\
\n\     and consolidated level tiers.\
\n\
\n- In-Game Configuration & Datapack Integration:\
\n\     Adjust mechanics, numerical limits, and interface options in real time\
\n\     using Config Overhauled. Customize enchantment themes, recipes, and modular\
\n\     content through registered datapacks.

